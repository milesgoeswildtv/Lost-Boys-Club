name: Chaturbate bundle verification

on:
  pull_request:
    paths:
      - "chaturbate/**"
      - "relay/**"
      - "scripts/verify-chaturbate-bundle.mjs"
      - ".github/workflows/chaturbate-bundle.yml"
  push:
    branches:
      - main
      - "fix/**"
      - "feature/**"
    paths:
      - "chaturbate/**"
      - "relay/**"
      - "scripts/verify-chaturbate-bundle.mjs"
      - ".github/workflows/chaturbate-bundle.yml"

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify Chaturbate upload bundle and overlay contracts
        run: node scripts/verify-chaturbate-bundle.mjs
      - name: Test Cloudflare relay event normalization
        run: node relay/worker.test.mjs
      - name: Check operator control script syntax
        run: node --check overlay/control.js
      - name: Check Cloudflare Worker module syntax
        run: node --input-type=module --check < relay/worker.js
